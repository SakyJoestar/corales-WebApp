name: Sync to Hugging Face Space

on:
  push:
    branches:
      - master
      - develop

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HF_SSH_PRIVATE_KEY }}

      - name: Trust huggingface.co host key
        run: ssh-keyscan -H hf.co >> ~/.ssh/known_hosts

      - name: Push to Hugging Face Space
        run: |
          HF_BRANCH="${GITHUB_REF_NAME}"
          if [ "$HF_BRANCH" = "master" ]; then HF_BRANCH="main"; fi
          git push --force git@hf.co:spaces/SamuelGal/coralWebApp "HEAD:${HF_BRANCH}"
